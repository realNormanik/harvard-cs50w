{% load static %}
<!-- Load the Django staticfiles library to access static assets like CSS, images, and icons -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>_Ncyclopedia{% block title %}{% endblock %}</title><!-- Placeholder for the title block that will be set by child templates -->
        <link rel="shortcut icon" type="image/x-icon" href="{% static '/encyclopedia/favicon.ico' %}" /><!-- Link to the favicon using Django's static tag -->
        <link href="{% static '/encyclopedia/styles.css' %}" rel="stylesheet"><!-- Link to the stylesheet using Django's static tag -->
        <script src="{% static '/encyclopedia/script.js' %}" as="script" defer></script><!-- Links the external JavaScript file and ensures it loads after the page -->
        {% block Quill %}
        {% endblock %}
    </head>
    <body class="light-theme">

        <div class="row">
        <!-- Main container for layout, containing the sidebar and main content -->

            <div class="sidebar">
            <!-- Sidebar section -->

                <div class="box-logo">
                <!-- Container for the image -->
                    <a href="/" aria-label="home">
                        <img class="logo" src="/static/encyclopedia/logo-light.webp" style="width:175px" alt="Wikipedia">
                        <!-- Logo displayed in the sidebar -->
                    </a>
                </div>

                <div class="box-sidebar">
                <!-- Container for the search form -->
                    <form class="form-sidebar" action="{% url 'wiki:search' %}" method="post">
                    <!-- Form for searching encyclopedia pages. The form uses the 'search' URL from the wiki app -->

                        <svg class="icon-sidebar" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                            <g>
                                <path d="M12.2 13.6a7 7 0 111.4-1.4l5.4 5.4-1.4 1.4zM3 8a5 5 0 1010 0A5 5 0 003 8"></path>
                            </g>
                        </svg>
                        <!-- Search icon displayed in the input field -->

                        <input class="search" type="text" name="q" placeholder="Search Pages" type="submit">
                        <!-- Input field for entering search queries -->

                        {% csrf_token %}
                        <!-- CSRF token for security -->
                    </form>
                </div>

                <div style="margin-top: 10px;">
                    <a href="{% url 'wiki:index' %}">Home</a>
                    <!-- Link to the home page using the 'index' URL from the wiki app -->
                </div>

                <div style="margin-top: 5px;margin-bottom: 5px;">
                    <a href="{% url 'wiki:new' %}">Create New Page</a>
                    <!-- Link to the page for creating a new encyclopedia entry -->
                </div>

                <div>
                    <a href="{% url 'wiki:random_page' %}">Random Page</a>
                    <!-- Link to a random encyclopedia page -->
                </div>

                <button class="theme-button" id="theme-toggle">Theme: light</button>

                {% block nav %}
                <!-- Placeholder for additional navigation links or content added by child templates -->
                {% endblock %}
            </div>

            <main class="main">
            <!-- Main content area -->

                {% block body %}
                <!-- Placeholder for the body content provided by child templates -->
                {% endblock %}
            </main>
        </div>

        <!-- label with a link to the GitHub repository -->
        <aside class="github-box">
            <div>
                <a href="https://github.com/realNormanik/harvard-cs50w/tree/main/project-1/wiki" target="_blank">
                    <p>View on GitHub</p>
                    <svg class="github-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 512" aria-hidden="true">
                        <path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-40.4-.3-61.4 0 0-70 15-84.7-29.8 0 0-11.4-29.1-27.8-36.6 0 0-22.9-15.7 1.6-15.4 0 0 24.9 2 38.6 25.8 21.9 38.6 58.6 27.5 72.9 20.9 2.3-16 8.8-27.1 16-33.7-55.9-6.2-112.3-14.3-112.3-110.5 0-27.5 7.6-41.3 23.6-58.9-2.6-6.5-11.1-33.3 2.6-67.9 20.9-6.5 69 27 69 27 20-5.6 41.5-8.5 62.8-8.5s42.8 2.9 62.8 8.5c0 0 48.1-33.6 69-27 13.7 34.7 5.2 61.4 2.6 67.9 16 17.7 25.8 31.5 25.8 58.9 0 96.5-58.9 104.2-114.8 110.5 9.2 7.9 17 22.9 17 46.4 0 33.7-.3 75.4-.3 83.6 0 6.5 4.6 14.4 17.3 12.1C428.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.9c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2z"></path>
                    </svg>
                </a>
            </div>
        </aside>
    </body>
</html>
